<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Price a store: The Basket field sheet</title>
<meta name="description" content="Record the same ten grocery items the NYC Health Department priced in 2019.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#129506;</text></svg>">
<style>
:root{
  --surface:#FCFBF9;--panel:#FFFFFF;--sunk:#F2F1EE;--ink:#15181C;--ink-2:#454C56;
  --ink-3:#6E7681;--rule:#DFDDD8;--accent:#0B6FBF;--warm:#C4562A;--good:#0E7A4E;
}
@media (prefers-color-scheme:dark){:root{
  --surface:#101318;--panel:#181C22;--sunk:#0B0E12;--ink:#EDEFF2;--ink-2:#A8B0BB;
  --ink-3:#7C848F;--rule:#2A2F37;--accent:#3A92D8;--warm:#D97140;--good:#3FB07A;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--surface);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.mono{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* header: one line, not a card */
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--rule)}
.hrow{display:flex;gap:8px;align-items:center;padding:8px 12px;max-width:560px;margin:0 auto}
.hrow input{flex:1;min-width:0;font:inherit;font-size:16px;font-weight:600;padding:8px 10px;
  border:1px solid var(--rule);border-radius:7px;background:var(--surface);color:var(--ink)}
.hrow input.zip{flex:0 0 76px}
.count{font-size:13px;font-weight:700;color:var(--ink-3);white-space:nowrap;padding-left:2px}
.bar{height:3px;background:var(--sunk)}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .18s}

main{max-width:560px;margin:0 auto;padding:0 12px}
.tip{font-size:12.5px;color:var(--ink-3);padding:9px 2px 6px}

/* the list: one row per item */
ul{list-style:none;margin:0;padding:0;border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:var(--panel)}
li{border-bottom:1px solid var(--rule)}
li:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:10px;padding:9px 11px}
.n{font-size:11px;font-weight:700;color:var(--ink-3);width:15px;flex:none;font-variant-numeric:tabular-nums}
.lab{flex:1;min-width:0}
.lab b{display:block;font-size:14.5px;font-weight:650;letter-spacing:-.01em;line-height:1.25}
.lab span{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{position:relative;flex:none;width:92px}
.price::before{content:"$";position:absolute;left:9px;top:50%;transform:translateY(-50%);
  font-size:15px;color:var(--ink-3);pointer-events:none}
.price input{width:100%;font:inherit;font-size:17px;font-weight:600;padding:9px 8px 9px 21px;
  border:1px solid var(--rule);border-radius:7px;background:var(--surface);color:var(--ink);
  font-variant-numeric:tabular-nums;text-align:right}
.price input:focus{border-color:var(--accent)}
.more{flex:none;width:30px;height:34px;border:0;background:transparent;color:var(--ink-3);
  font-size:19px;line-height:1;cursor:pointer;border-radius:6px}
.more[aria-expanded="true"]{background:var(--sunk);color:var(--ink)}

li.filled .lab b{color:var(--good)}
li.skip{background:var(--sunk)}
li.skip .lab b{color:var(--ink-3);text-decoration:line-through}
li.sub .lab b::after{content:" \2260";color:var(--warm);font-weight:700}
li.sale .price input{border-color:var(--warm)}

/* the exceptions, hidden until asked for */
.extra{display:none;padding:0 11px 10px 36px;gap:6px;flex-wrap:wrap}
.extra.open{display:flex}
.extra button{font:inherit;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:16px;
  border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);cursor:pointer}
.extra button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.extra input{flex:1 1 100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--rule);
  border-radius:7px;background:var(--surface);color:var(--ink)}

footer{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--rule);
  padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:20}
.frow{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:center}
.frow .st{font-size:12.5px;color:var(--ink-3);flex:1;min-width:0}
button.go{font:inherit;font-size:14px;font-weight:700;padding:10px 16px;border:0;border-radius:7px;
  background:var(--warm);color:#fff;cursor:pointer}
button.go.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--rule)}

dialog{border:0;border-radius:11px;padding:0;max-width:520px;width:92%;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:16px}
.dlg h2{margin:0 0 4px;font-size:16px}
.dlg p{margin:0 0 10px;font-size:12.5px;color:var(--ink-3)}
.dlg textarea{width:100%;height:180px;font-family:ui-monospace,Menlo,monospace;font-size:11px;
  border:1px solid var(--rule);border-radius:7px;padding:9px;background:var(--sunk);color:var(--ink)}
.dlg .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <input id="store" placeholder="Store name" autocomplete="off" enterkeyhint="next">
    <input id="zip" class="zip" placeholder="ZIP" inputmode="numeric" autocomplete="off">
    <span class="count mono" id="count">0/10</span>
  </div>
  <div class="bar"><i id="barfill"></i></div>
</header>

<main>
  <p class="tip">Type the price of the <b>exact</b> item listed. Tap <b>&#8943;</b> only if it was a substitute, not sold, or on sale.</p>
  <ul id="list"></ul>
</main>

<footer><div class="frow">
  <span class="st" id="status">Saves as you go</span>
  <button class="go ghost" type="button" id="new">New store</button>
  <button class="go" type="button" id="done">Finish</button>
</div></footer>

<dialog id="out"><div class="dlg">
  <h2>Your visit</h2>
  <p>Save this file. One per store visit.</p>
  <textarea id="json" readonly></textarea>
  <div class="acts">
    <button class="go" type="button" id="dl">Download</button>
    <button class="go ghost" type="button" id="copy">Copy</button>
    <button class="go ghost" type="button" id="close">Back</button>
  </div>
</div></dialog>

<script src="collect.js?v=1785207314"></script>
</body>
</html>
