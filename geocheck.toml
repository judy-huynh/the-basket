# Expectations for The Basket.
# data/basket.json is a derived data file, not GeoJSON, so the structural
# geometry checks do not apply. The value here is the trap scan over source.

[traps]
# src/vendor is a third-party library, not our code. Scanning it produces
# warnings nobody can act on, which is how a check stops being read.
paths = ["src/app.js", "src/styles.css", "scripts", "index.html", "README.md"]
